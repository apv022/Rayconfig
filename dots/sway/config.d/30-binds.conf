# Rayconfig — keybindings. Mod is Super (the Windows key).
#
# This file IS the cheat sheet: `## section` starts a group and a '# comment'
# above a bindsym is its description. `ray keys` / Super+/ render it.
# Vim-style h/j/k/l focus belongs in ~/.config/sway/config.d/90-local.conf.

## apps
# terminal
bindsym $mod+Return exec $term
# app launcher
bindsym $mod+d exec $menu
# editor (solarvim)
bindsym $mod+n exec $term -e env NVIM_APPNAME=solarvim nvim
# files (terminal in home)
bindsym $mod+e exec $term -D ~
# system menu: update, theme, power, keys
bindsym $mod+Alt+space exec ~/.local/bin/ray menu
# power menu
bindsym $mod+Escape exec ~/.local/bin/ray menu power
# key cheat sheet
bindsym $mod+slash exec $term --app-id ray-float -e ~/.local/bin/ray keys --pager

## windows
# switch window
bindsym $mod+Tab exec ~/.local/bin/winlist
# close window
bindsym $mod+q kill
# snap left half
bindsym $mod+Left exec ~/.local/bin/snap left
# snap right half
bindsym $mod+Right exec ~/.local/bin/snap right
# maximise
bindsym $mod+Up exec ~/.local/bin/snap up
# restore
bindsym $mod+Down exec ~/.local/bin/snap down
# move window in the tiling layout
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down
# resize
bindsym $mod+Ctrl+Left resize shrink width 40px
bindsym $mod+Ctrl+Right resize grow width 40px
bindsym $mod+Ctrl+Up resize grow height 40px
bindsym $mod+Ctrl+Down resize shrink height 40px
# float / tile
bindsym $mod+space floating toggle
# fullscreen
bindsym $mod+f fullscreen toggle
# next split side by side / stacked
bindsym $mod+b split h
bindsym $mod+v split v
# tabbed / stacked / split layout
bindsym $mod+w layout tabbed
bindsym $mod+s layout stacking
bindsym $mod+Shift+t layout toggle split
# focus parent container
bindsym $mod+a focus parent
# scratchpad: stash / show
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

## workspaces
# go to workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
# move window to workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
# previous / next workspace
bindsym $mod+Ctrl+Prior workspace prev
bindsym $mod+Ctrl+Next workspace next

## system
# lock screen
bindsym $mod+l exec swaylock -f
# toggle sunny / sunset theme
bindsym $mod+t exec ~/.local/bin/theme toggle
# screenshot region to clipboard
bindsym $mod+Shift+s exec ~/.local/bin/shot region
# screenshot region to ~/Pictures/screenshots
bindsym $mod+Ctrl+s exec ~/.local/bin/shot save
# screenshot whole screen to file
bindsym Print exec ~/.local/bin/shot full
# dismiss notifications
bindsym $mod+comma exec makoctl dismiss --all
# reload sway config
bindsym $mod+Shift+r reload
# log out
bindsym $mod+Shift+e exec swaynag -t warning -m 'Log out of sway?' -B 'Log out' 'swaymsg exit'

## media
# volume up / down / mute
bindsym --locked XF86AudioRaiseVolume exec ~/.local/bin/vol up 5
bindsym --locked XF86AudioLowerVolume exec ~/.local/bin/vol down 5
bindsym --locked XF86AudioMute exec ~/.local/bin/vol mute
# play / next / previous
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
# brightness up / down
bindsym --locked XF86MonBrightnessUp exec ~/.local/bin/bright up
bindsym --locked XF86MonBrightnessDown exec ~/.local/bin/bright down
