# Rayconfig — keybindings
#
# Windows-style Mod (Super). Every '# comment' above a bindsym becomes the
# description in `ray keys` ($mod+Shift+slash).
#
# Sway is a tiler, so Win+Left/Right snaps by floating the window into half the
# screen. For tiling moves use $mod+Shift+arrows; for the vim-style h/j/k/l
# focus keys, add your own binds to ~/.config/sway/config.d/90-local.conf.

# open terminal
bindsym $mod+Return exec $term
# open launcher
bindsym $mod+d exec $menu
# open file manager (home directory in a terminal)
bindsym $mod+e exec foot -D ~
# switch window (Alt-Tab equivalent)
bindsym $mod+Tab exec ~/.local/bin/winlist
# lock screen
bindsym $mod+l exec swaylock -f -c $bg

# close window
bindsym $mod+q kill
# reload sway
bindsym $mod+Shift+r reload
# exit sway
bindsym $mod+Shift+e exec swaynag -t warning \
	-m 'Exit sway?' -B 'Yes' 'swaymsg exit'

# snap window to left half
bindsym $mod+Left exec ~/.local/bin/snap left
# snap window to right half
bindsym $mod+Right exec ~/.local/bin/snap right
# maximise window
bindsym $mod+Up exec ~/.local/bin/snap up
# restore window
bindsym $mod+Down exec ~/.local/bin/snap down

# move window in the tiling layout
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down
# resize focused window
bindsym $mod+Ctrl+Left resize shrink width 5px
bindsym $mod+Ctrl+Right resize grow width 5px
bindsym $mod+Ctrl+Up resize grow height 5px
bindsym $mod+Ctrl+Down resize shrink height 5px

# switch workspace
bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace 9
# move window to workspace
bindsym $mod+Shift+1 move container to workspace 1
bindsym $mod+Shift+2 move container to workspace 2
bindsym $mod+Shift+3 move container to workspace 3
bindsym $mod+Shift+4 move container to workspace 4
bindsym $mod+Shift+5 move container to workspace 5
bindsym $mod+Shift+6 move container to workspace 6
bindsym $mod+Shift+7 move container to workspace 7
bindsym $mod+Shift+8 move container to workspace 8
bindsym $mod+Shift+9 move container to workspace 9

# toggle floating
bindsym $mod+space floating toggle
# fullscreen
bindsym $mod+f fullscreen toggle
# split horizontal / vertical
bindsym $mod+b split h
bindsym $mod+v split v
# focus parent container
bindsym $mod+a focus parent

# toggle sunny / sunset
bindsym $mod+t exec ~/.local/bin/theme toggle

# screenshot region to clipboard
bindsym $mod+Shift+s exec ~/.local/bin/shot region
# screenshot full screen to ~/Pictures/screenshots
bindsym Print exec ~/.local/bin/shot full
# key cheat sheet
bindsym $mod+Shift+slash exec $term -e sh -c '~/.local/bin/keys | less'

# volume
bindsym XF86AudioRaiseVolume exec ~/.local/bin/vol up 5
bindsym XF86AudioLowerVolume exec ~/.local/bin/vol down 5
bindsym XF86AudioMute exec ~/.local/bin/vol mute
# media (playerctl is in optional.txt; these fail silently without it)
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous
# brightness
bindsym XF86MonBrightnessUp exec ~/.local/bin/bright up
bindsym XF86MonBrightnessDown exec ~/.local/bin/bright down

# focus parent
bindsym $mod+Shift+a focus parent
