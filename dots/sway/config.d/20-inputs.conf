# Rayconfig — input

input "type:keyboard" {
	xkb_layout us
	repeat_rate 40
	repeat_delay 250
}

input "type:touchpad" {
	tap enabled
	natural_scroll enabled
	dwt enabled
	click_method clickfinger
}

input "type:pointer" {
	accel_profile adaptive
	pointer_accel 0
}

# Monitors are intentionally not pinned here. Sway names them per machine
# (DP-1, eDP-1, Virtual-1 …) and guessing is how you get a black screen in a
# VM. Put per-machine overrides in ~/.config/sway/config.d/90-local.conf:
# it matches the include glob above, is gitignored, and is yours.
#
#   output eDP-1 scale 1.5
#   output DP-1  mode 2560x1440@165Hz position 0,0
