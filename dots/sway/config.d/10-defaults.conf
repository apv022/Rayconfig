# Rayconfig — sway defaults

set $mod Mod4
set $term foot
set $menu fuzzel

font pango:JetBrains Mono 9

default_border pixel 2
default_floating_border pixel 2
smart_borders on
gaps inner 8
gaps outer 4
hide_edge_borders smart

focus_follows_mouse yes
mouse_warping output
floating_modifier $mod

titlebar_border_thickness 1
titlebar_padding 4

client.focused          $accent $bg2    $fg     $accent $accent
client.focused_inactive $bg2    $bg2    $dim    $bg3    $bg3
client.unfocused        $bg     $bg     $dim    $bg3    $bg3
client.urgent           $urgent $urgent $bg     $urgent $urgent
client.placeholder      $bg     $bg     $fg     $bg3    $bg3
client.background       $bg

# small floating utility windows (cheat sheet, update log)
for_window [app_id="ray-float"] floating enable, resize set 960 720, move position center
for_window [window_role="pop-up"] floating enable
for_window [window_type="dialog"] floating enable

# wallpaper from the theme; Super+I → Wallpaper overrides it in 85-settings.conf
output * bg ~/.local/state/rayconfig/wallpaper.png fill
