# Rayconfig — sway defaults

set $mod Mod4
set $term foot
set $menu fuzzel

font pango:JetBrains Mono 9

default_border pixel 2
default_floating_border pixel 2
smart_borders on
gaps inner 6
gaps outer 6
hide_edge_borders smart

focus_follows_mouse no
mouse_warping output
floating_modifier $mod

titlebar_border_thickness 1
titlebar_padding 4

client.focused          $accent $accent $bg     $accent $accent
client.focused_inactive $bg2    $bg2    $dim    $bg3    $bg3
client.unfocused        $bg     $bg     $dim    $bg3    $bg3
client.urgent           $urgent $urgent $bg     $urgent $urgent
client.placeholder      $bg     $bg     $fg     $bg3    $bg3
client.background       $bg
